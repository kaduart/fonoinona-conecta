name: Build EAS (loja)

# Botão manual: Actions › "Build EAS (loja)" › Run workflow.
# Precisa do secret EXPO_TOKEN (expo.dev › Account settings › Access tokens).
# O build roda nos servidores da Expo; o link aparece no log e em expo.dev.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: Perfil do eas.json (production = loja, preview = APK de teste)
        type: choice
        options: [production, preview]
        default: production

concurrency:
  group: eas-build-${{ inputs.platform }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS ${{ inputs.platform }} (${{ inputs.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Conferir EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=EXPO_TOKEN ausente::Crie o token em expo.dev e salve em Settings › Secrets › Actions como EXPO_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # app.json ainda não tem extra.eas.projectId: liga ao projeto da Expo
      # (cria se não existir). Idempotente; para fixar, commitar o projectId gerado.
      - name: Ligar ao projeto EAS
        run: |
          if ! grep -q '"projectId"' app.json; then
            eas init --non-interactive --force
            grep -o '"projectId": *"[^"]*"' app.json || true
          fi

      - name: eas build
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
