name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: App (testes e tipos)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  api:
    name: API (testes, tipos e Mongo)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      TESTE_MONGO: '1'
      MONGO_URI_TESTE: mongodb://localhost:27017/conecta_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee saida-testes.txt
      - name: Resumo da falha como anotação
        if: failure()
        shell: bash
        run: |
          node -e "const t=require('fs').readFileSync('saida-testes.txt','utf8').replace(/\x1b\[[0-9;]*m/g,'').slice(-3500);console.log('::error title=Testes da API::'+t.replace(/%/g,'%25').replace(/\r/g,'').replace(/\n/g,'%0A'))"
