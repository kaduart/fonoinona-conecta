name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: App (testes e tipos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  api:
    name: API (testes, tipos e Mongo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      TESTE_MONGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
