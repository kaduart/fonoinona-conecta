name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: App (testes e tipos)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  api:
    name: API (testes, tipos e Mongo)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      TESTE_MONGO: '1'
      MONGO_URI_TESTE: mongodb://localhost:27017/conecta_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
